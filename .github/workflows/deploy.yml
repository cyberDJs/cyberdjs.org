name: Deploy to InterServer

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "${{ secrets.SSH_PORT }}" "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          TARGET: /home/eimyherr/domains/cyberdjs.org/public_html
        run: |
          tar --exclude=.git --exclude=.github --exclude=README.md -czf - . | \
          ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
          "mkdir -p '$TARGET' && find '$TARGET' -mindepth 1 -maxdepth 1 ! -name cgi-bin -exec rm -rf {} + && tar -xzf - -C '$TARGET'"
